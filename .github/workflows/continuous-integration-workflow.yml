name: Unit tests
on: [push, pull_request]

jobs:
  build:
    name: Unit tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Install third party libraries
        run: ./InstallThirdPartyLibraries.ps1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Workaround for a known runner-images bug where one MSVC toolset
      # version's VC ATL component is missing its atlmfc folder entirely,
      # while another co-installed toolset version has it intact
      # (https://github.com/actions/runner-images/issues/9873). MSBuild's
      # C++ toolchain computes its own include/lib paths from the specific
      # toolset directory it resolves, so setting an ambient INCLUDE env
      # var has no effect; instead, copy the atlmfc folder from a toolset
      # that has it into any sibling toolset version that's missing it.
      - name: Workaround missing ATL toolset files
        shell: pwsh
        run: |
          $msvcRoots = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio" -Recurse -Directory -Filter MSVC -ErrorAction SilentlyContinue
          if (-not $msvcRoots) { throw "Could not locate any VC\Tools\MSVC directory under Visual Studio" }
          $fixedAny = $false
          foreach ($msvcRoot in $msvcRoots) {
            $toolsets = Get-ChildItem $msvcRoot.FullName -Directory
            $withAtl = $toolsets | Where-Object { Test-Path (Join-Path $_.FullName "atlmfc\include\atlbase.h") }
            $withoutAtl = $toolsets | Where-Object { -not (Test-Path (Join-Path $_.FullName "atlmfc\include\atlbase.h")) }
            if (-not $withAtl) { continue }
            foreach ($v in $withoutAtl) {
              Write-Host "Copying ATL from $($withAtl[0].FullName) into toolset $($v.FullName) (missing ATL)"
              Copy-Item -Path (Join-Path $withAtl[0].FullName "atlmfc") -Destination (Join-Path $v.FullName "atlmfc") -Recurse -Force
              $fixedAny = $true
            }
          }
          if (-not $fixedAny) { Write-Host "No missing-ATL toolsets found; nothing to fix" }

      - name: Build solution
        run: msbuild /m CppCoverage.sln /p:Configuration=Debug /p:Platform=x64

      - name: Run CppCoverageTest
        run: .\x64\Debug\CppCoverageTest.exe --gtest_filter=-CodeCoverageRunnerTest.OptimizedBuild # Require VS2013

      - name: Run ExporterTest
        run: .\x64\Debug\ExporterTest.exe

      - name: Run FileFilterTest
        run: .\x64\Debug\FileFilterTest.exe --gtest_filter=-RelocationsExtractorTest.Extract # Require mspdbcore.dll

      - name: Run OpenCppCoverageTest
        run: .\x64\Debug\OpenCppCoverageTest.exe

      - name: Run PluginTest
        run: .\x64\Debug\PluginTest.exe

      - name: Run ToolsTest
        run: .\x64\Debug\ToolsTest.exe

  build-arm64:
    name: Unit tests (ARM64)
    # Native ARM64-hosted runner: builds and runs tests as genuine ARM64
    # processes (no x64 cross-compilation, no emulation for our own code).
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      # No prebuilt ARM64 ThirdParty NuGet package exists (upstream's
      # OpenCppCoverageThirdParty releases only ever published x86/x64), so
      # dependencies are built from source via vcpkg instead of
      # InstallThirdPartyLibraries.ps1.
      - name: Build third party libraries
        run: .\BuildThirdPartyDependenciesArm64.bat

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Same ATL-toolset workaround as the x64 job; see comment there.
      - name: Workaround missing ATL toolset files
        shell: pwsh
        run: |
          $msvcRoots = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio" -Recurse -Directory -Filter MSVC -ErrorAction SilentlyContinue
          if (-not $msvcRoots) { throw "Could not locate any VC\Tools\MSVC directory under Visual Studio" }
          $fixedAny = $false
          foreach ($msvcRoot in $msvcRoots) {
            $toolsets = Get-ChildItem $msvcRoot.FullName -Directory
            $withAtl = $toolsets | Where-Object { Test-Path (Join-Path $_.FullName "atlmfc\include\atlbase.h") }
            $withoutAtl = $toolsets | Where-Object { -not (Test-Path (Join-Path $_.FullName "atlmfc\include\atlbase.h")) }
            if (-not $withAtl) { continue }
            foreach ($v in $withoutAtl) {
              Write-Host "Copying ATL from $($withAtl[0].FullName) into toolset $($v.FullName) (missing ATL)"
              Copy-Item -Path (Join-Path $withAtl[0].FullName "atlmfc") -Destination (Join-Path $v.FullName "atlmfc") -Recurse -Force
              $fixedAny = $true
            }
          }
          if (-not $fixedAny) { Write-Host "No missing-ATL toolsets found; nothing to fix" }

      - name: Build solution
        run: msbuild /m CppCoverage.sln /p:Configuration=Debug /p:Platform=ARM64

      - name: Run CppCoverageTest
        # DebugInformationEnumeratorTest.Enumerate is also excluded here:
        # on ARM64 the compiler does not emit a distinct PDB line-table
        # entry for this test function's closing brace (dead-code epilogue
        # under `if (false)`), unlike x86/x64. This is a PDB/codegen
        # discrepancy in an artificial test fixture, not a coverage
        # instrumentation correctness issue.
        run: .\ARM64\Debug\CppCoverageTest.exe --gtest_filter=-CodeCoverageRunnerTest.OptimizedBuild:-DebugInformationEnumeratorTest.Enumerate # Require VS2013

      - name: Run ExporterTest
        run: .\ARM64\Debug\ExporterTest.exe

      - name: Run FileFilterTest
        run: .\ARM64\Debug\FileFilterTest.exe --gtest_filter=-RelocationsExtractorTest.Extract # Require mspdbcore.dll

      - name: Run OpenCppCoverageTest
        run: .\ARM64\Debug\OpenCppCoverageTest.exe

      - name: Run PluginTest
        run: .\ARM64\Debug\PluginTest.exe

      - name: Run ToolsTest
        run: .\ARM64\Debug\ToolsTest.exe

