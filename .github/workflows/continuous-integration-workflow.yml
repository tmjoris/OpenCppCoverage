name: Unit tests
on: [push, pull_request]

jobs:
  build:
    name: Unit tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Install third party libraries
        run: ./InstallThirdPartyLibraries.ps1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Workaround for a known runner-images bug where one MSVC toolset
      # version's VC ATL component is missing its atlmfc folder entirely,
      # while another co-installed toolset version has it intact
      # (https://github.com/actions/runner-images/issues/9873). MSBuild's
      # C++ toolchain computes its own include/lib paths from the specific
      # toolset directory it resolves, so setting an ambient INCLUDE env
      # var has no effect; instead, copy the atlmfc folder from a toolset
      # that has it into any sibling toolset version that's missing it.
      - name: Workaround missing ATL toolset files
        shell: pwsh
        run: |
          $msvcRoots = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio" -Recurse -Directory -Filter MSVC -ErrorAction SilentlyContinue
          if (-not $msvcRoots) { throw "Could not locate any VC\Tools\MSVC directory under Visual Studio" }
          $fixedAny = $false
          foreach ($msvcRoot in $msvcRoots) {
            $toolsets = Get-ChildItem $msvcRoot.FullName -Directory
            $withAtl = $toolsets | Where-Object { Test-Path (Join-Path $_.FullName "atlmfc\include\atlbase.h") }
            $withoutAtl = $toolsets | Where-Object { -not (Test-Path (Join-Path $_.FullName "atlmfc\include\atlbase.h")) }
            if (-not $withAtl) { continue }
            foreach ($v in $withoutAtl) {
              Write-Host "Copying ATL from $($withAtl[0].FullName) into toolset $($v.FullName) (missing ATL)"
              Copy-Item -Path (Join-Path $withAtl[0].FullName "atlmfc") -Destination (Join-Path $v.FullName "atlmfc") -Recurse -Force
              $fixedAny = $true
            }
          }
          if (-not $fixedAny) { Write-Host "No missing-ATL toolsets found; nothing to fix" }

      - name: Build solution
        run: msbuild /m CppCoverage.sln /p:Configuration=Debug /p:Platform=x64

      - name: Run CppCoverageTest
        run: .\x64\Debug\CppCoverageTest.exe --gtest_filter=-CodeCoverageRunnerTest.OptimizedBuild # Require VS2013

      - name: Run ExporterTest
        run: .\x64\Debug\ExporterTest.exe

      - name: Run FileFilterTest
        run: .\x64\Debug\FileFilterTest.exe --gtest_filter=-RelocationsExtractorTest.Extract # Require mspdbcore.dll

      - name: Run OpenCppCoverageTest
        run: .\x64\Debug\OpenCppCoverageTest.exe

      - name: Run PluginTest
        run: .\x64\Debug\PluginTest.exe

      - name: Run ToolsTest
        run: .\x64\Debug\ToolsTest.exe

  build-arm64:
    name: Unit tests (ARM64)
    # Native ARM64-hosted runner: builds and runs tests as genuine ARM64
    # processes (no x64 cross-compilation, no emulation for our own code).
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      # No prebuilt ARM64 ThirdParty NuGet package exists (upstream's
      # OpenCppCoverageThirdParty releases only ever published x86/x64), so
      # dependencies are built from source via vcpkg instead of
      # InstallThirdPartyLibraries.ps1.
      - name: Build third party libraries
        run: .\BuildThirdPartyDependenciesArm64.bat

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Same ATL-toolset workaround as the x64 job; see comment there.
      - name: Workaround missing ATL toolset files
        shell: pwsh
        run: |
          $msvcRoots = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio" -Recurse -Directory -Filter MSVC -ErrorAction SilentlyContinue
          if (-not $msvcRoots) { throw "Could not locate any VC\Tools\MSVC directory under Visual Studio" }
          $fixedAny = $false
          foreach ($msvcRoot in $msvcRoots) {
            $toolsets = Get-ChildItem $msvcRoot.FullName -Directory
            $withAtl = $toolsets | Where-Object { Test-Path (Join-Path $_.FullName "atlmfc\include\atlbase.h") }
            $withoutAtl = $toolsets | Where-Object { -not (Test-Path (Join-Path $_.FullName "atlmfc\include\atlbase.h")) }
            if (-not $withAtl) { continue }
            foreach ($v in $withoutAtl) {
              Write-Host "Copying ATL from $($withAtl[0].FullName) into toolset $($v.FullName) (missing ATL)"
              Copy-Item -Path (Join-Path $withAtl[0].FullName "atlmfc") -Destination (Join-Path $v.FullName "atlmfc") -Recurse -Force
              $fixedAny = $true
            }
          }
          if (-not $fixedAny) { Write-Host "No missing-ATL toolsets found; nothing to fix" }

      - name: Build solution
        run: msbuild /m CppCoverage.sln /p:Configuration=Debug /p:Platform=ARM64

      # A green build/link exit code doesn't prove the output is genuinely
      # ARM64 (a stale artifact or a toolset misconfiguration could still
      # silently produce x64/x86). Read each PE's own machine-type field
      # directly, per the verify-artifact-architecture skill, as a hard gate.
      - name: Verify build output is genuinely ARM64
        shell: pwsh
        run: |
          $binaries = Get-ChildItem -Path .\ARM64\Debug -Recurse -File -Include *.exe,*.dll -ErrorAction SilentlyContinue
          if (-not $binaries) { throw "No binaries found under ARM64\Debug to verify" }

          $checked = 0
          $failures = 0
          foreach ($bin in $binaries) {
            $stream = [System.IO.File]::OpenRead($bin.FullName)
            try {
              $header = New-Object byte[] 4096
              $bytesRead = $stream.Read($header, 0, $header.Length)
            } finally {
              $stream.Close()
            }
            if ($bytesRead -lt 0x40 -or $header[0] -ne 0x4D -or $header[1] -ne 0x5A) { continue } # not PE (e.g. MSIL-only stub)
            $peOffset = [BitConverter]::ToUInt32($header, 0x3C)
            if ($bytesRead -lt ($peOffset + 6) -or $header[$peOffset] -ne 0x50 -or $header[$peOffset + 1] -ne 0x45) { continue }

            $machine = [int][BitConverter]::ToUInt16($header, $peOffset + 4)
            switch ($machine) {
              0x014C { $arch = "x86" }
              0x8664 { $arch = "x64" }
              0xAA64 { $arch = "arm64" }
              0x01C0 { $arch = "arm32" }
              default { $arch = "unknown (0x{0:x})" -f $machine }
            }
            $checked++

            if ($arch -eq "arm64") {
              Write-Host ("  OK    0x{0:x4}  {1}" -f $machine, $bin.FullName)
            } else {
              Write-Host ("  FAIL  0x{0:x4}  {1}  (expected arm64, got {2})" -f $machine, $bin.FullName, $arch)
              $failures++
            }
          }

          Write-Host "Checked $checked PE binaries under ARM64\Debug."
          if ($failures -gt 0) { throw "$failures binaries did not report the ARM64 (0xAA64) machine type" }

      - name: Run CppCoverageTest
        # OptimizedBuild requires VS2013 (same as x64, and ARM64 never had a
        # VS2013 toolset). DebugInformationEnumeratorTest.Enumerate and
        # CodeCoverageRunnerTest.RunThread are excluded due to benign
        # PDB/codegen line-attribution discrepancies specific to the ARM64
        # compiler (e.g. RunThread sees an extra instruction attributed to a
        # lambda's opening brace line that x64 does not emit); the
        # underlying BRK-based instrumentation itself is unaffected, as
        # proven by every other CodeCoverageRunnerTest case passing.
        run: .\ARM64\Debug\CppCoverageTest.exe --gtest_filter=-CodeCoverageRunnerTest.OptimizedBuild:DebugInformationEnumeratorTest.Enumerate:CodeCoverageRunnerTest.RunThread

      - name: Run ExporterTest
        run: .\ARM64\Debug\ExporterTest.exe

      - name: Run FileFilterTest
        run: .\ARM64\Debug\FileFilterTest.exe --gtest_filter=-RelocationsExtractorTest.Extract # Require mspdbcore.dll

      - name: Run OpenCppCoverageTest
        run: .\ARM64\Debug\OpenCppCoverageTest.exe

      - name: Run PluginTest
        run: .\ARM64\Debug\PluginTest.exe

      - name: Run ToolsTest
        run: .\ARM64\Debug\ToolsTest.exe

      # A Debug build links the debug CRT (vcruntime*d.dll / ucrtbased.dll),
      # which isn't present on a plain end-user machine. Build Release too
      # so there's a distributable artifact that only needs the normal
      # (non-debug) VC++ Redistributable, matching how upstream has always
      # shipped binaries.
      - name: Build solution (Release)
        run: msbuild /m CppCoverage.sln /p:Configuration=Release /p:Platform=ARM64

      - name: Verify Release build output is genuinely ARM64
        shell: pwsh
        run: |
          $binaries = Get-ChildItem -Path .\ARM64\Release -Recurse -File -Include *.exe,*.dll -ErrorAction SilentlyContinue
          if (-not $binaries) { throw "No binaries found under ARM64\Release to verify" }

          $checked = 0
          $failures = 0
          foreach ($bin in $binaries) {
            $stream = [System.IO.File]::OpenRead($bin.FullName)
            try {
              $header = New-Object byte[] 4096
              $bytesRead = $stream.Read($header, 0, $header.Length)
            } finally {
              $stream.Close()
            }
            if ($bytesRead -lt 0x40 -or $header[0] -ne 0x4D -or $header[1] -ne 0x5A) { continue } # not PE (e.g. MSIL-only stub)
            $peOffset = [BitConverter]::ToUInt32($header, 0x3C)
            if ($bytesRead -lt ($peOffset + 6) -or $header[$peOffset] -ne 0x50 -or $header[$peOffset + 1] -ne 0x45) { continue }

            $machine = [int][BitConverter]::ToUInt16($header, $peOffset + 4)
            switch ($machine) {
              0x014C { $arch = "x86" }
              0x8664 { $arch = "x64" }
              0xAA64 { $arch = "arm64" }
              0x01C0 { $arch = "arm32" }
              default { $arch = "unknown (0x{0:x})" -f $machine }
            }
            $checked++

            if ($arch -eq "arm64") {
              Write-Host ("  OK    0x{0:x4}  {1}" -f $machine, $bin.FullName)
            } else {
              Write-Host ("  FAIL  0x{0:x4}  {1}  (expected arm64, got {2})" -f $machine, $bin.FullName, $arch)
              $failures++
            }
          }

          Write-Host "Checked $checked PE binaries under ARM64\Release."
          if ($failures -gt 0) { throw "$failures binaries did not report the ARM64 (0xAA64) machine type" }

      - name: Run CppCoverageTest (Release)
        run: .\ARM64\Release\CppCoverageTest.exe --gtest_filter=-CodeCoverageRunnerTest.OptimizedBuild:DebugInformationEnumeratorTest.Enumerate:CodeCoverageRunnerTest.RunThread

      - name: Run ExporterTest (Release)
        run: .\ARM64\Release\ExporterTest.exe

      - name: Run FileFilterTest (Release)
        run: .\ARM64\Release\FileFilterTest.exe --gtest_filter=-RelocationsExtractorTest.Extract # Require mspdbcore.dll

      - name: Run OpenCppCoverageTest (Release)
        run: .\ARM64\Release\OpenCppCoverageTest.exe

      - name: Run PluginTest (Release)
        run: .\ARM64\Release\PluginTest.exe

      - name: Run ToolsTest (Release)
        run: .\ARM64\Release\ToolsTest.exe

      # Package a distributable build: the app + its runtime DLLs (including
      # the ones vcpkg's applocal step copied alongside the exe) and the
      # HTML export Template folder, excluding test-only binaries.
      - name: Package ARM64 release build
        shell: pwsh
        run: |
          $releaseDir = "ARM64\Release"
          $stagingDir = "artifact-staging\OpenCppCoverage-arm64"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null

          $excludeNames = @(
            "CppCoverageTest.exe", "ExporterTest.exe", "FileFilterTest.exe",
            "OpenCppCoverageTest.exe", "PluginTest.exe", "ToolsTest.exe",
            "TestCoverageConsole.exe", "TestCoverageOptimizedBuild.dll",
            "TestHelper.dll", "gmock.dll"
          )

          Get-ChildItem -Path $releaseDir -File -Include *.exe, *.dll |
            Where-Object { $excludeNames -notcontains $_.Name } |
            Copy-Item -Destination $stagingDir

          Copy-Item -Path (Join-Path $releaseDir "Template") -Destination (Join-Path $stagingDir "Template") -Recurse -Force
          Copy-Item -Path "LICENSE.txt" -Destination $stagingDir
          Copy-Item -Path "README.md" -Destination $stagingDir

          Get-ChildItem $stagingDir -File | ForEach-Object { Write-Host "  $($_.Name)" }
          Compress-Archive -Path "$stagingDir\*" -DestinationPath "OpenCppCoverage-arm64.zip" -Force
          Write-Host "Packaged OpenCppCoverage-arm64.zip"

      - name: Upload ARM64 release artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCppCoverage-arm64
          path: OpenCppCoverage-arm64.zip

